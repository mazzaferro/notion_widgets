<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Composição da carteira — Agosto 2026</title>
<style>*{box-sizing:border-box}body{margin:0;padding:16px;color:#292929;background:white;font:14px/1.5 Arial,sans-serif}h2{font-size:19px;margin:0 0 4px}h3{font-size:15px;margin:14px 0 4px}p{margin:6px 0}.muted{color:#616161;font-size:12px}.plots{display:grid;gap:10px}.plot svg{width:100%;height:265px;display:block}.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:13px}.swatch{display:inline-block;width:22px;border-top:3px solid;vertical-align:middle;margin-right:6px}.dashed{border-top-style:dashed}#tip{min-height:48px;background:#f7f7f7;padding:8px 12px;font-size:13px}.composition{display:grid;grid-template-columns:minmax(280px,1fr) minmax(240px,1fr);gap:16px;align-items:start}.ring{max-width:440px;width:100%;margin:auto}.ring svg{width:100%;display:block}button{font:inherit;color:inherit;border:0;background:none;text-align:left;cursor:pointer;padding:6px}button:focus-visible,[tabindex]:focus-visible{outline:2px solid #164f80;outline-offset:2px}button:hover{background:#f1f1f1}.assets{width:100%;border-collapse:collapse}.assets td,.assets th{padding:5px 6px;border-bottom:1px solid #ececec;text-align:left}.assets td:last-child,.assets th:last-child{text-align:right}.assets button{width:100%;padding:0}.roles{display:flex;flex-wrap:wrap;gap:6px}.roles button{border-bottom:3px solid var(--color);font-size:13px}.datum{fill:transparent;pointer-events:all;cursor:pointer}.segment{stroke:white;stroke-width:1.5;cursor:pointer}.selected{stroke:#222;stroke-width:3}details{margin:12px 0;font-size:12px;overflow:auto}.history{width:100%;border-collapse:collapse}.history td,.history th{text-align:right;padding:4px 8px;white-space:nowrap}.history td:first-child,.history th:first-child{text-align:left}@media(max-width:680px){.composition{grid-template-columns:1fr}body{padding:10px}.ring{max-width:440px;margin:auto;width:100%}}
/* Adapt rings and asset list to the available embed height. */
html{height:100%}body{height:100vh;min-height:720px;display:flex;flex-direction:column;padding:12px}
h2,p,#tip,details{flex-shrink:0}#chart{flex:1;min-height:0;display:flex;flex-direction:column}
.roles{flex-shrink:0;margin:4px 0 8px}.composition{flex:1;min-height:0}
.ring{height:100%;min-height:180px;max-width:440px}.ring svg{height:100%;width:100%}
#tip{min-height:54px}details{margin:8px 0}details[open]{max-height:140px;overflow:auto}
@media(max-width:680px){h2{font-size:17px}.muted{font-size:11px}body{padding:10px}.composition{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(180px,1fr) auto;gap:8px}.roles{gap:4px}.roles button{font-size:12px;padding:4px}.assets thead{display:none}.assets tbody{display:grid;grid-template-columns:1fr 1fr;column-gap:14px}.assets tr{display:flex;justify-content:space-between;border-bottom:1px solid #ececec}.assets td{border:0;padding:3px 0;font-size:12px}.assets button{font-size:12px;min-height:22px}.ring{min-height:180px;max-width:360px}#tip{font-size:12px;padding:8px}.history td,.history th{padding:3px 6px}#note{line-height:1.4}}
</style><h2>Composição da carteira — Agosto 2026</h2><p class="muted" id="sub"></p><main id="chart"></main><div id="tip" role="status" aria-live="polite"></div><details><summary>Ver os valores do gráfico</summary><div id="values"></div></details><p class="muted" id="note"></p>
<script>const DATA={"date": "2026-08-31", "allocation": [{"asset": "SMTO3", "weight": 0.2164989117997355, "role": "Midfield", "classe": "Ações"}, {"asset": "SUZB3", "weight": 0.11421276769830097, "role": "Defense", "classe": "Ações"}, {"asset": "PRIO3", "weight": 0.10993540691935126, "role": "Defense", "classe": "Ações"}, {"asset": "SIMH3", "weight": 0.09694766460541067, "role": "Attack", "classe": "Ações"}, {"asset": "VIVA3", "weight": 0.07082748197065575, "role": "Midfield", "classe": "Ações"}, {"asset": "TTEN3", "weight": 0.0693947524632013, "role": "Midfield", "classe": "Ações"}, {"asset": "VAMO3", "weight": 0.06883021099698934, "role": "Attack", "classe": "Ações"}, {"asset": "PFRM3", "weight": 0.052266673998032344, "role": "Attack", "classe": "Ações"}, {"asset": "MDNE3", "weight": 0.045563429209903826, "role": "Attack", "classe": "Ações"}, {"asset": "RAIL3", "weight": 0.04297969282959002, "role": "Attack", "classe": "Ações"}, {"asset": "JALL3", "weight": 0.04051544192464924, "role": "Midfield", "classe": "Ações"}, {"asset": "Cx", "weight": 0.006640849253649325, "role": "Liquidity", "classe": "Renda fixa e caixa"}, {"asset": "DI", "weight": 0.06538671633053046, "role": "Liquidity", "classe": "Renda fixa e caixa"}], "roles": {"Midfield": 0.3972365881582418, "Defense": 0.22414817461765224, "Attack": 0.3065876716399262, "Liquidity": 0.07202756558417979}},TYPE="alocacao";const fmt=(v,n=2)=>v.toLocaleString('pt-BR',{minimumFractionDigits:n,maximumFractionDigits:n}),pct=(v,n=1)=>fmt(v*100,n)+'%',date=s=>new Date(s+'T12:00:00').toLocaleDateString('pt-BR',{month:'short',year:'2-digit'}),full=s=>new Date(s+'T12:00:00').toLocaleDateString('pt-BR');const colors={Attack:'#b9453f',Midfield:'#bd8d21',Defense:'#357ca6',Liquidity:'#64854c'};const tip=document.getElementById('tip'),main=document.getElementById('chart');function say(s){tip.textContent=s}function svg(tag,attrs,text){const el=document.createElementNS('http://www.w3.org/2000/svg',tag);Object.entries(attrs).forEach(([k,v])=>el.setAttribute(k,v));if(text!==undefined)el.textContent=text;return el}function table(headers,rows){return '<table class="history"><thead><tr>'+headers.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')+'</tbody></table>'}
function trend(parent,title,series,max,format){const box=document.createElement('div');box.className='plot';parent.append(box);box.innerHTML='<h3>'+title+'</h3><div class="legend">'+series.map(s=>'<span><i class="swatch '+(s.dash?'dashed':'')+'" style="border-color:'+s.color+'"></i>'+s.label+'</span>').join('')+'</div>';const width=Math.max(280,box.clientWidth),height=265,left=56,right=14,top=20,bottom=38,pw=width-left-right,ph=height-top-bottom;const chart=svg('svg',{viewBox:'0 0 '+width+' '+height,role:'img','aria-label':title});box.append(chart);const points=DATA.history,x=i=>left+i*pw/(points.length-1),y=v=>top+ph*(1-v/max);for(let i=0;i<=4;i++){let value=max*i/4;chart.append(svg('line',{x1:left,y1:y(value),x2:width-right,y2:y(value),stroke:'#dedede','stroke-width':1}));chart.append(svg('text',{x:left-6,y:y(value)+4,'text-anchor':'end','font-size':12,fill:'#555'},format(value)))}chart.append(svg('line',{x1:left,y1:top,x2:left,y2:height-bottom,stroke:'#888'}));const intervals=width<500?3:6;for(let i=0;i<=intervals;i++){let index=Math.round(i*(points.length-1)/intervals);chart.append(svg('text',{x:x(index),y:height-12,'text-anchor':i===0?'start':i===intervals?'end':'middle','font-size':12,fill:'#555'},date(points[index].date)))}series.forEach(s=>chart.append(svg('path',{d:points.map((p,i)=>(i?'L':'M')+x(i)+','+y(p[s.key])).join(' '),fill:'none',stroke:s.color,'stroke-width':2.5,...(s.dash?{'stroke-dasharray':'6 4'}:{})})));points.forEach((p,i)=>{const mark=svg('rect',{x:x(i)-pw/(points.length-1)/2,y:top,width:pw/(points.length-1),height:ph,class:'datum',tabindex:0,role:'button','aria-label':full(p.date)+'; '+series.map(s=>s.label+': '+format(p[s.key])).join('; ')});const show=()=>say(full(p.date)+' — '+series.map(s=>s.label+': '+format(p[s.key])).join(' | ')+(TYPE==='potencial'?' | Potencial estimado: '+pct(p.potencial):''));mark.addEventListener('pointerenter',show);mark.addEventListener('focus',show);mark.addEventListener('click',show);chart.append(mark)})}
function composition(){main.innerHTML='<div class="roles"></div><div class="composition"><div class="ring"></div><div><table class="assets"><thead><tr><th>Ativo</th><th>Peso</th></tr></thead><tbody></tbody></table></div></div>';const ring=main.querySelector('.ring'),w=Math.max(280,ring.clientWidth),c=w/2,r=w*.47,chart=svg('svg',{viewBox:'0 0 '+w+' '+w,role:'img','aria-label':'Composição das ações e do caixa em três níveis: classe, função e ativo'});ring.append(chart);let paths=[];function arc(label,weight,start,inner,outer,color){const a=start*2*Math.PI-Math.PI/2,b=(start+weight)*2*Math.PI-Math.PI/2,pt=(rad,t)=>[c+rad*Math.cos(t),c+rad*Math.sin(t)],p1=pt(outer,a),p2=pt(outer,b),p3=pt(inner,b),p4=pt(inner,a),large=weight>.5?1:0;const path=svg('path',{d:'M'+p1+' A'+outer+','+outer+' 0 '+large+' 1 '+p2+' L'+p3+' A'+inner+','+inner+' 0 '+large+' 0 '+p4+' Z',fill:color,class:'segment',tabindex:0,role:'button','aria-label':label+' '+pct(weight,2)});const show=()=>{paths.forEach(p=>p.classList.remove('selected'));path.classList.add('selected');say(label+' — '+pct(weight,2)+' das ações e do caixa')};path.addEventListener('pointerenter',show);path.addEventListener('focus',show);path.addEventListener('click',show);chart.append(path);paths.push(path);return show}let start=0;for(const cls of ['Ações','Renda fixa e caixa']){const ls=DATA.allocation.filter(x=>x.classe===cls),sum=ls.reduce((s,x)=>s+x.weight,0);arc(cls,sum,start,r*.21,r*.46,cls==='Ações'?'#999':'#8daa78');let rs=start;for(const role of ['Attack','Midfield','Defense','Liquidity']){const assets=ls.filter(x=>x.role===role);if(!assets.length)continue;const total=assets.reduce((s,x)=>s+x.weight,0),show=arc(role,total,rs,r*.47,r*.72,colors[role]);const btn=document.createElement('button');btn.textContent=role+' '+pct(total);btn.style.setProperty('--color',colors[role]);btn.addEventListener('click',show);main.querySelector('.roles').append(btn);let at=rs;assets.forEach((asset,i)=>{const showAsset=arc(asset.asset,asset.weight,at,r*.73,r,colors[role]);at+=asset.weight;const row=document.createElement('tr');row.innerHTML='<td><button>'+asset.asset+'</button></td><td>'+pct(asset.weight,2)+'</td>';row.querySelector('button').addEventListener('click',showAsset);row.querySelector('button').addEventListener('focus',showAsset);main.querySelector('tbody').append(row)});rs+=total}start+=sum}chart.append(svg('text',{x:c,y:c+5,'text-anchor':'middle','font-size':14,fill:'#333'},'100%'));say('Clique ou passe o cursor nos anéis para consultar classe, função e ativo.');document.getElementById('values').innerHTML=table(['Função','Peso'],Object.entries(DATA.roles).map(([k,v])=>[k,pct(v,2)]));document.getElementById('note').textContent='Base: ações, renda fixa e caixa, somando 100%. As opções são tratadas separadamente no texto; não entram nos anéis.'}
function render(){main.innerHTML='';document.getElementById('sub').textContent=TYPE==='alocacao'?'Fechamento de '+full(DATA.date):'Histórico mensal até '+full(DATA.date);if(TYPE==='alocacao'){composition();return}main.className='plots';if(TYPE==='potencial'){trend(main,'Cota e valor estimado por cota',[{key:'cota',label:'Cota',color:'#357ca6'},{key:'valor_estimado',label:'Valor estimado pelos modelos',color:'#bd8d21',dash:true}],3,v=>fmt(v,2));document.getElementById('values').innerHTML=table(['Mês','Cota','Potencial estimado','Valor estimado por cota'],DATA.history.map(x=>[full(x.date),fmt(x.cota,4),pct(x.potencial),fmt(x.valor_estimado,4)]));document.getElementById('note').textContent='Valor estimado = cota × (1 + potencial estimado). A linha tracejada representa uma estimativa da gestão, sem prazo definido para realização; não é promessa de retorno.';say('Passe o cursor pelo histórico para consultar os valores mensais.')}else{trend(main,'Índice interno de risco',[{key:'risco',label:'Risco',color:'#357ca6'}],2,v=>fmt(v,2));trend(main,'Caixa (% do patrimônio)',[{key:'caixa',label:'Caixa',color:'#64854c'}],.3,v=>pct(v,1));document.getElementById('values').innerHTML=table(['Mês','Índice interno de risco','Caixa'],DATA.history.map(x=>[full(x.date),fmt(x.risco,2),pct(x.caixa)]));document.getElementById('note').textContent='O índice de risco é uma avaliação interna ponderada da carteira. Não representa volatilidade nem probabilidade de perda. Os painéis usam unidades e escalas diferentes.';say('Passe o cursor pelo histórico para consultar risco e caixa.')}}document.querySelector('details').addEventListener('toggle',render);render();let timer;window.addEventListener('resize',()=>{clearTimeout(timer);timer=setTimeout(render,100)});</script></html>
