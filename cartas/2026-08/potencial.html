const fmt=(v,n=2)=>v.toLocaleString('pt-BR',{minimumFractionDigits:n,maximumFractionDigits:n});
const pct=(v,n=1)=>fmt(v*100,n)+'%';
const full=s=>new Date(s+'T12:00:00').toLocaleDateString('pt-BR');
const month=s=>new Date(s+'T12:00:00').toLocaleDateString('pt-BR',{month:'short',year:'2-digit'});
const axisMonth=s=>new Date(s+'T12:00:00').toLocaleDateString('pt-BR',{month:'short'}).replace('.','')+'/'+s.slice(2,4);
const main=document.getElementById('chart'),tip=document.getElementById('tip');
const gold='#f1c232',goldText='#876407',black='#000000';
function svg(tag,attrs,text){const el=document.createElementNS('http://www.w3.org/2000/svg',tag);Object.entries(attrs).forEach(([k,v])=>el.setAttribute(k,v));if(text!==undefined)el.textContent=text;return el}
function table(headers,rows){return '<table><thead><tr>'+headers.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')+'</tbody></table>'}
function describe(p){
 return full(p.date)+' — '+(TYPE==='potencial'?
  'Cota: '+fmt(p.cota,4)+' | Adicional estimado: '+fmt(p.cota*p.potencial,4)+' | Valor intrínseco estimado: '+fmt(p.valor_estimado,4)+' | Potencial: '+pct(p.potencial):
  'Caixa: '+pct(p.caixa)+' | Índice interno de risco: '+fmt(p.risco));
}
function render(){
 const recent=document.getElementById('recent').checked;
 const points=recent?DATA.history.slice(-12):DATA.history;
 document.getElementById('sub').textContent='Fechamentos mensais de '+month(points[0].date)+' a '+month(points.at(-1).date);
 document.getElementById('legend').innerHTML=TYPE==='potencial'?
  '<span><i class="key" style="--color:#000"></i>Cota Fortuna</span><span><i class="key" style="--color:#f1c232"></i>Adicional p/ valor intrínseco</span><span style="color:#777">Potencial de valorização (%) no topo</span>':
  '<span><i class="key" style="--color:#000"></i>Caixa (%) · eixo esquerdo</span><span><i class="linekey"></i>Risco da carteira · eixo direito</span>';
 main.innerHTML='';
 const width=Math.max(280,main.clientWidth),height=Math.max(180,main.clientHeight),left=54,right=TYPE==='risco'?54:14,top=32,bottom=46;
 const pw=width-left-right,ph=height-top-bottom,step=pw/points.length,bw=step*.72;
 const x=i=>left+(i+.5)*step, y=v=>top+ph*(1-v/(TYPE==='potencial'?2.5:.3)),yr=v=>top+ph*(1-(v-1)/1.5);
 const chart=svg('svg',{viewBox:'0 0 '+width+' '+height,role:'img','aria-label':TYPE==='potencial'?'Colunas empilhadas: cota em preto e adicional estimado em dourado. Potencial percentual no topo.':'Caixa em colunas pretas no eixo esquerdo e risco em linha dourada no eixo direito.'});main.append(chart);
 const text=(xx,yy,label,attrs={})=>chart.append(svg('text',{x:xx,y:yy,'font-size':12,'text-anchor':'middle',fill:'#626262',...attrs},label));
 const ticks=TYPE==='potencial'?5:6;
 for(let t=0;t<=ticks;t++){
  const yy=top+ph*(1-t/ticks);
  chart.append(svg('line',{x1:left,y1:yy,x2:width-right,y2:yy,stroke:'#dedede','stroke-width':1}));
  text(left-7,yy+4,TYPE==='potencial'?fmt(t*.5,1):pct(t*.05,0),{'text-anchor':'end'});
  if(TYPE==='risco')text(width-right+7,yy+4,fmt(1+t*.25),{'text-anchor':'start'});
 }
 text(left,15,TYPE==='potencial'?'Cota':'Caixa (%)',{'text-anchor':'start',fill:'#333'});
 if(TYPE==='risco')text(width-right,15,'Risco',{'text-anchor':'end',fill:'#333'});
 chart.append(svg('line',{x1:left,y1:top,x2:left,y2:height-bottom,stroke:'#888','stroke-width':1}));
 chart.append(svg('line',{x1:left,y1:height-bottom,x2:width-right,y2:height-bottom,stroke:'#888','stroke-width':1}));
 if(TYPE==='risco')chart.append(svg('line',{x1:width-right,y1:top,x2:width-right,y2:height-bottom,stroke:'#888','stroke-width':1}));
 const maxLabels=Math.max(2,Math.floor(pw/72)),dateIndices=new Set(Array.from({length:maxLabels},(_,i)=>Math.round(i*(points.length-1)/(maxLabels-1))));
 const labelEvery=Math.max(1,Math.ceil(36/step));
 const valueLabel=i=>i===points.length-1||(i%labelEvery===0&&(points.length-1-i)*step>=36);
 points.forEach((p,i)=>{
  const xx=x(i),base=height-bottom;
  if(TYPE==='potencial'){
   const current=y(p.cota),total=y(p.cota*(1+p.potencial));
   chart.append(svg('rect',{x:xx-bw/2,y:current,width:bw,height:base-current,fill:black,'data-series':'cota','data-value':p.cota}));
   chart.append(svg('rect',{x:xx-bw/2,y:total,width:bw,height:current-total,fill:gold,'data-series':'adicional','data-value':p.cota*p.potencial}));
   if(valueLabel(i))text(xx,total-8,pct(p.potencial,0),{fill:'#777','font-weight':600,'text-anchor':'middle'});
   if(bw>=25)text(xx,current+(base-current)*.55,fmt(p.cota,2),{fill:'#fff','font-size':12,'font-weight':600});
  }else{
   const yy=y(p.caixa);
   chart.append(svg('rect',{x:xx-bw/2,y:yy,width:bw,height:base-yy,fill:black,'data-series':'caixa','data-value':p.caixa}));
   if(valueLabel(i)){const inside=base-yy>=22;let labelY=inside?yy+(base-yy)/2+4:yy-7;if(inside&&Math.abs(labelY-(yr(p.risco)-12))<20)labelY=base-8;text(xx,labelY,pct(p.caixa),{fill:inside?'#fff':'#292929','font-size':12,'font-weight':600,'paint-order':'stroke',stroke:inside?'#000':'#fff','stroke-width':2,'text-anchor':'middle'});}
  }
  if(dateIndices.has(i))text(xx,height-15,axisMonth(p.date),{'text-anchor':i===0?'start':i===points.length-1?'end':'middle'});
 });
 if(TYPE==='risco'){
  chart.append(svg('path',{d:points.map((p,i)=>(i?'L':'M')+x(i)+','+yr(p.risco)).join(' '),fill:'none',stroke:gold,'stroke-width':2.5}));
  points.forEach((p,i)=>{
   chart.append(svg('circle',{cx:x(i),cy:yr(p.risco),r:3,fill:gold,stroke:'#fff','stroke-width':.7,'data-series':'risco','data-value':p.risco}));
   if(valueLabel(i))text(x(i),yr(p.risco)-12,fmt(p.risco),{fill:goldText,'font-weight':600,'paint-order':'stroke',stroke:'#fff','stroke-width':3,'stroke-linejoin':'round','text-anchor':'middle'});
  });
 }
 points.forEach((p,i)=>{
  const mark=svg('rect',{x:x(i)-step/2,y:top,width:step,height:ph,class:'hit',tabindex:0,role:'button','aria-label':describe(p)});
  const show=()=>{tip.textContent=describe(p)};
  mark.addEventListener('pointerenter',show);mark.addEventListener('focus',show);mark.addEventListener('click',show);chart.append(mark);
 });
 tip.textContent=describe(points.at(-1));
 document.getElementById('values').innerHTML=TYPE==='potencial'?
  table(['Mês','Cota','Adicional estimado','Valor intrínseco estimado','Potencial'],points.map(p=>[full(p.date),fmt(p.cota,4),fmt(p.cota*p.potencial,4),fmt(p.valor_estimado,4),pct(p.potencial)])):
  table(['Mês','Caixa','Índice interno de risco'],points.map(p=>[full(p.date),pct(p.caixa),fmt(p.risco)]));
 document.getElementById('note').textContent=TYPE==='potencial'?
  'O adicional dourado é a cota multiplicada pelo potencial de valorização. O topo da coluna representa o valor intrínseco estimado pelos modelos da gestão, sem prazo definido para realização. Não é promessa de retorno.':
  'Caixa e risco usam eixos diferentes. O risco é uma avaliação interna ponderada da carteira, não uma medida de volatilidade ou probabilidade de perda.';
}
document.querySelector('details').addEventListener('toggle',render);
render();document.getElementById('recent').addEventListener('change',render);let timer;window.addEventListener('resize',()=>{clearTimeout(timer);timer=setTimeout(render,100)});
